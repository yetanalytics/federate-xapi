services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: hla_xapi
      POSTGRES_USER: ${SIM_DB_USER:?Set SIM_DB_USER}
      POSTGRES_PASSWORD: ${SIM_DB_PASSWORD:?Set SIM_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  lrs-db:
    image: postgres:17
    volumes:
      - lrs_db_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${LRSQL_DB_USER:?Set LRSQL_DB_USER}
      POSTGRES_PASSWORD: ${LRSQL_DB_PASSWORD:?Set LRSQL_DB_PASSWORD}
      POSTGRES_DB: lrsql_db
    ports:
      - "127.0.0.1:5433:5433"
    command: ["postgres", "-p", "5433"]

  lrs:
    # build: . # switch to this for active dev
    image: yetanalytics/lrsql:latest
    command:
      - /lrsql/bin/run_postgres.sh
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - lrs-db
    environment:
      LRSQL_API_KEY_DEFAULT: ${LRS_KEY:?Set LRS_KEY}
      LRSQL_API_SECRET_DEFAULT: ${LRS_SECRET:?Set LRS_SECRET}
      LRSQL_ADMIN_USER_DEFAULT: ${LRS_ADMIN_USER:?Set LRS_ADMIN_USER}
      LRSQL_ADMIN_PASS_DEFAULT: ${LRS_ADMIN_PASSWORD:?Set LRS_ADMIN_PASSWORD}
      LRSQL_DB_HOST: lrs-db
      LRSQL_DB_PORT: 5433
      LRSQL_DB_NAME: lrsql_db
      LRSQL_DB_USER: ${LRSQL_DB_USER:?Set LRSQL_DB_USER}
      LRSQL_DB_PASSWORD: ${LRSQL_DB_PASSWORD:?Set LRSQL_DB_PASSWORD}
      # If Postgres is too slow to start, increase this
      LRSQL_POOL_INITIALIZATION_FAIL_TIMEOUT: 10000
  amq:
    image: apache/artemis:latest-alpine
    environment:
      - ARTEMIS_USER=${ARTEMIS_USER:?Set ARTEMIS_USER}
      - ARTEMIS_PASSWORD=${ARTEMIS_PASSWORD:?Set ARTEMIS_PASSWORD}
    ports:
      - "127.0.0.1:61616:61616"
      - "127.0.0.1:8161:8161"

volumes:
  postgres-data:
  lrs_db_data:
